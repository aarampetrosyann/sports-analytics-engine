<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pitch Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="stage">
      <div class="toolbar">
        <div class="stage-bar">
          <span id="conn" class="conn" data-state="connecting">Connecting…</span>
          <label><input type="checkbox" id="smooth" checked> Interpolate</label>
          <label><input type="checkbox" id="trail" checked> Ball trail</label>
        </div>
        <div class="views" id="views" role="group" aria-label="Camera view"></div>
      </div>
      <canvas id="pitch" aria-label="Live tactical pitch view"></canvas>
    </section>

    <aside class="hud">
      <header class="scoreboard">
        <div class="team"><span class="swatch home"></span>Home</div>
        <div class="score"><span id="score-0">0</span><span class="dash">–</span><span id="score-1">0</span></div>
        <div class="team away">Away<span class="swatch away"></span></div>
        <div class="clock" id="clock">00:00</div>
        <ol class="goals" id="goals"></ol>
      </header>

      <section class="card">
        <h2>Match stats</h2>
        <div class="holder" id="holder">Waiting for data…</div>
        <div class="stats" id="stats"></div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Events</h2>
          <div class="chips" id="event-filter" role="group" aria-label="Filter events">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="goals" aria-pressed="false">Goals</button>
            <button type="button" data-filter="shots" aria-pressed="false">Shots</button>
            <button type="button" data-filter="setpieces" aria-pressed="false">Set pieces</button>
          </div>
        </div>
        <ol id="events" class="events"><li class="empty">No events yet</li></ol>
      </section>

      <section class="card">
        <h2>Top performers</h2>
        <div class="leaders" id="leaders"></div>
        <details class="all-players">
          <summary>All players</summary>
          <div class="dist-grid">
            <table id="dist-0"></table>
            <table id="dist-1"></table>
          </div>
        </details>
      </section>

      <details class="telemetry">
        <summary>Stream health <span id="t-summary" class="muted"></span></summary>
        <dl>
          <div><dt>Ingest</dt><dd id="t-fps">–</dd></div>
          <div><dt>Packets lost</dt><dd id="t-lost">–</dd></div>
          <div><dt>Edge → server</dt><dd id="t-edge">–</dd></div>
          <div><dt>Server → client</dt><dd id="t-wire">–</dd></div>
          <div><dt>Processing</dt><dd id="t-proc">–</dd></div>
          <div><dt>Render</dt><dd id="t-render">–</dd></div>
        </dl>
      </details>
    </aside>
  </main>
  <script src="pitch.js"></script>
  <script src="app.js"></script>
</body>
</html>
