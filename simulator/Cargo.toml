[package]
name = "pitch-sim"
version = "0.1.0"
edition = "2021"
description = "Simulated edge device: streams physics-constrained soccer tracking data over UDP"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
